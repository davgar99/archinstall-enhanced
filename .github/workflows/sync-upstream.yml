name: Sync upstream

on:
  schedule:
    # Run away from the top of the hour, when GitHub Actions is busiest.
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge archlinux/archinstall
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: false

      - name: Merge upstream and preserve fork changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config merge.conflictStyle zdiff3

          git remote add upstream https://github.com/archlinux/archinstall.git
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'Fork is already up to date.'
            echo 'UP_TO_DATE=true' >> "$GITHUB_ENV"
            exit 0
          fi

          # Bring in every non-conflicting upstream change. If both sides changed
          # the same hunk, prefer the fork's current version.
          if ! git merge --no-ff --no-edit -X ours upstream/master; then
            if [[ ! -f .git/MERGE_HEAD ]]; then
              echo 'Merge failed before a merge was started.' >&2
              exit 1
            fi

            # Some conflict types, such as modify/delete or rename conflicts,
            # are not resolved by -X ours. Resolve only those unresolved paths
            # in favor of the fork as well.
            while IFS= read -r -d '' path; do
              echo "Keeping fork version of conflicted path: $path"

              if git checkout --ours -- "$path" 2>/dev/null; then
                git add -- "$path"
              else
                git rm -f --ignore-unmatch -- "$path"
              fi
            done < <(git diff --name-only --diff-filter=U -z)

            if git ls-files -u | grep -q .; then
              echo 'Unresolved merge entries remain; refusing to publish.' >&2
              git status --short
              exit 1
            fi

            git commit --no-edit
          fi

          git diff --check HEAD^ HEAD
          git status --short

      - name: Publish sync branch and open pull request
        if: env.UP_TO_DATE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: automation/upstream-sync
        shell: bash
        run: |
          set -euo pipefail

          # Authentication is introduced only after merge preparation is done.
          # No newly merged project code is executed in this write-capable step.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" 2>/dev/null || true
          git push --force-with-lease origin "HEAD:refs/heads/${SYNC_BRANCH}"

          pr_number="$(gh pr list --head "${SYNC_BRANCH}" --base master --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            gh pr create \
              --base master \
              --head "${SYNC_BRANCH}" \
              --title 'chore: sync upstream archinstall' \
              --body 'Automated upstream synchronization. CI runs on this pull request before the merged tree reaches master.'
          else
            echo "Updated existing upstream-sync PR #${pr_number}."
          fi
