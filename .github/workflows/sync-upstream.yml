name: Sync upstream

on:
  schedule:
    # Run away from the top of the hour, when GitHub Actions is busiest.
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge archlinux/archinstall
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: false

      - name: Merge upstream without hiding conflicts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config merge.conflictStyle zdiff3

          git remote add upstream https://github.com/archlinux/archinstall.git
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'Fork is already up to date.'
            echo 'UP_TO_DATE=true' >> "$GITHUB_ENV"
            exit 0
          fi

          if ! git merge --no-ff --no-edit upstream/master; then
            if [[ ! -f .git/MERGE_HEAD ]]; then
              echo 'Merge failed before a merge was started.' >&2
              exit 1
            fi

            {
              echo '## Upstream sync requires review'
              echo
              echo 'The following files conflict with upstream. No conflict resolution was committed or pushed:'
              echo
              git diff --name-only --diff-filter=U | sed 's/^/- `/' | sed 's/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"

            echo 'Upstream merge has conflicts; refusing to silently discard upstream changes.' >&2
            git diff --name-only --diff-filter=U >&2
            git merge --abort
            exit 1
          fi

          git diff --check HEAD^ HEAD

          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo 'Working tree changed unexpectedly after merge; refusing to continue.' >&2
            git status --short >&2
            exit 1
          fi

          echo "EXPECTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate merged tree in isolated Arch container
        if: env.UP_TO_DATE != 'true'
        shell: bash
        run: |
          set -euo pipefail

          validation_dir="$(mktemp -d)"
          trap 'rm -rf "$validation_dir"' EXIT

          # Validate an exported tree without .git instead of exposing the live
          # checkout to code and build hooks from the merged upstream tree.
          git archive --format=tar "$EXPECTED_HEAD" | tar -xf - -C "$validation_dir"

          docker run --rm \
            -v "$validation_dir:/repo" \
            -w /repo \
            archlinux/archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman-key --init
              pacman --noconfirm -Sy archlinux-keyring
              pacman --noconfirm -Syyu
              pacman --noconfirm -S \
                bandit \
                gcc \
                pkgconfig \
                python-pip \
                python-pydantic \
                python-pyparted \
                python-setuptools \
                python-textual \
                python-uv
              pip install --break-system-packages --upgrade pip
              pip install --break-system-packages .[dev]
              pytest
              bandit -c pyproject.toml -r archinstall
              uv build --no-build-isolation --wheel
            '

      - name: Verify checkout integrity and push validated merge
        if: env.UP_TO_DATE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$EXPECTED_HEAD" ]]; then
            echo "HEAD changed during validation: expected $EXPECTED_HEAD, got $actual_head" >&2
            exit 1
          fi

          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo 'Live checkout changed during validation; refusing to push.' >&2
            git status --short >&2
            exit 1
          fi

          # The write credential is introduced only after validation and after
          # confirming the authenticated checkout is exactly the intended tree.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:master
