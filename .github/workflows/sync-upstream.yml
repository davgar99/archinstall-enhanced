name: Sync upstream

on:
  schedule:
    # Run away from the top of the hour, when GitHub Actions is busiest.
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge archlinux/archinstall
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: false

      - name: Merge upstream and preserve fork changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config merge.conflictStyle zdiff3

          git remote add upstream https://github.com/archlinux/archinstall.git
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'Fork is already up to date.'
            echo 'UP_TO_DATE=true' >> "$GITHUB_ENV"
            exit 0
          fi

          if ! git merge --no-ff --no-edit -X ours upstream/master; then
            if [[ ! -f .git/MERGE_HEAD ]]; then
              echo 'Merge failed before a merge was started.' >&2
              exit 1
            fi

            while IFS= read -r -d '' path; do
              echo "Keeping fork version of conflicted path: $path"

              if git checkout --ours -- "$path" 2>/dev/null; then
                git add -- "$path"
              else
                git rm -f --ignore-unmatch -- "$path"
              fi
            done < <(git diff --name-only --diff-filter=U -z)

            if git ls-files -u | grep -q .; then
              echo 'Unresolved merge entries remain; refusing to push.' >&2
              git status --short
              exit 1
            fi

            git commit --no-edit
          fi

          git diff --check HEAD^ HEAD
          git status --short

      - name: Validate merged tree in isolated Arch container
        if: env.UP_TO_DATE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            archlinux/archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman-key --init
              pacman --noconfirm -Sy archlinux-keyring
              pacman --noconfirm -Syyu
              pacman --noconfirm -S \
                bandit \
                gcc \
                pkgconfig \
                python-pip \
                python-pydantic \
                python-pyparted \
                python-setuptools \
                python-textual \
                python-uv
              pip install --break-system-packages --upgrade pip
              pip install --break-system-packages .[dev]
              pytest
              bandit -c pyproject.toml -r archinstall
              uv build --no-build-isolation --wheel
            '

      - name: Push validated merge
        if: env.UP_TO_DATE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # The write credential is introduced only after all merged code has
          # passed validation, and no project code is executed after this point.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:master
